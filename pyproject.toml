[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ndfilters"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "Similar to the filters in `scipy.ndimage` but accelerated using Numba"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>2",
    "numba",
    "astropy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
]
doc = [
    "pytest",
    "scipy",
    "pooch",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/sun-data/ndfilters"
Documentation = "https://ndfilters.readthedocs.io/en/latest"

[tool.pyright]
include = ["ndfilters"]
# The tests are excluded because `astropy` does not ship a `py.typed` marker.
# Expressions such as `numpy.linspace(...) * astropy.units.mm`, which the tests
# use heavily, are therefore inferred as a union of unit types rather than as a
# `Quantity`, and silencing that requires more noise than the tests are worth.
exclude = ["**/_tests"]
typeCheckingMode = "standard"

[tool.setuptools]
packages = ["ndfilters"]

[tool.setuptools.package-data]
ndfilters = ["py.typed"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
